name: Emergency cancel unverified Multiverse prerelease
on:
  push:
    branches: [main]
permissions:
  actions: write
  contents: read
jobs:
  cancel-unverified-run:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the in-flight release before publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh run view 43542889600 --repo "$GITHUB_REPOSITORY" --json status --jq .status)"
          if [[ "$status" == "in_progress" || "$status" == "queued" ]]; then
            gh run cancel 43542889600 --repo "$GITHUB_REPOSITORY"
            echo "Requested cancellation of unsafe run 43542889600 (status=$status)."
          else
            echo "Run 43542889600 is already $status; no cancellation needed."
          fi
